# Configuración canónica de hiperparámetros, features y calidad
# Fuente única de verdad para el pipeline offline y el servicio online (Capítulo 7)

feature_order:
  - customer_tenure_months
  - monthly_charges
  - total_charges
  - num_support_tickets
  - contract_type_code
  - has_dependents
  - avg_session_duration_min

data:
  raw_path: data/raw/customer_churn.csv
  train_path: data/processed/train.parquet
  test_path: data/processed/test.parquet
  reference_path: data/reference/reference_dataset.parquet
  test_size: 0.2
  random_state: 42

model:
  backend: xgboost
  n_estimators: 150
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

quality_gate:
  min_auc: 0.85
  min_f1: 0.75
  max_p95_latency_ms: 15.0
  max_drift_share: 0.3
