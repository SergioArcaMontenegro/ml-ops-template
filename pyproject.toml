[project]
name = "mlops-production-service"
version = "1.0.0"
description = "Plantilla de producción para microservicios de MLOps: Serving FastAPI, ONNX, Prometheus, Evidently y Argo Rollouts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sergio Arca Montenegro", email = "sergioarca02@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "prometheus-client>=0.20.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "onnxruntime>=1.17.0",
    "skl2onnx>=1.16.0",
    "onnx>=1.15.0",
    "evidently>=0.4.15",
    "httpx>=0.27.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "dvc>=3.48.0",
    "dvc-s3>=3.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
