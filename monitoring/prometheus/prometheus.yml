global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/prometheus_alerts.yml"

scrape_configs:
  - job_name: "mlops-inference-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["inference:8000"]
        labels:
          service: "churn-inference"
          environment: "production"

  - job_name: "pushgateway"
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          service: "drift-batch-jobs"
